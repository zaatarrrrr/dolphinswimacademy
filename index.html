<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meet management · Dolphin Swim Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#05508A; --navy:#0B3A66; --aqua:#4CBB47; --rope:#4CBB47; --coral:#F2644B; --focus:#05508A;
  --bg:#F5FBF4; --surface:#FFFFFF; --text:#0B2A45; --muted:#3D5D76; --line:#C9E3C6; --link:#05508A; --head-bg:#4CBB47; --head-text:#0B3A66;
  --ok-bg:#CFF3E2; --ok-tx:#0B5A38; --wait-bg:#FFEFC2; --wait-tx:#6B4C00; --no-bg:#FFD9D2; --no-tx:#7A1E0E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#06192B; --surface:#0C2A44; --text:#E8F4F8; --muted:#9DB8CC; --line:#1E4565; --link:#86CBF4; --focus:#86CBF4; --head-bg:#4CBB47;
    --ok-bg:#12432F; --ok-tx:#9BE6C0; --wait-bg:#4A3A0A; --wait-tx:#FFE08A; --no-bg:#58211A; --no-tx:#FFB5A8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#06192B; --surface:#0C2A44; --text:#E8F4F8; --muted:#9DB8CC; --line:#1E4565; --link:#86CBF4; --focus:#86CBF4; --head-bg:#4CBB47;
  --ok-bg:#12432F; --ok-tx:#9BE6C0; --wait-bg:#4A3A0A; --wait-tx:#FFE08A; --no-bg:#58211A; --no-tx:#FFB5A8;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.55}
h1,h2,h3{font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;line-height:1.2;margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}

header{background:var(--head-bg);color:var(--head-text);position:relative;overflow:hidden}
.hwrap{max-width:1040px;margin:0 auto;padding:22px 20px 34px;display:flex;align-items:center;gap:14px}
.hwrap svg{width:58px;height:58px;flex:none}
.hwrap h1{font-size:clamp(22px,3.4vw,32px);font-weight:700}
.hwrap p{margin:2px 0 0;color:#0B3158;font-size:16px;font-weight:600}
.ropeline{height:10px;background:repeating-linear-gradient(90deg,#0B3A66 0 10px,transparent 10px 20px);opacity:.85}

main{max-width:1040px;margin:0 auto;padding:22px 20px 60px}
.hub{background:var(--surface);border:2px solid var(--line);border-radius:18px;overflow:hidden;display:grid;grid-template-columns:210px 1fr;min-height:520px}
.side{background:color-mix(in srgb,var(--surface) 90%,var(--aqua));border-right:2px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px}
.meetname{padding:6px 12px 14px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.meetname span{display:block;color:var(--muted);font-weight:400;font-size:14px}
.tab{all:unset;cursor:pointer;padding:10px 12px;border-radius:10px;font-weight:500;font-size:15px}
.tab:hover{background:color-mix(in srgb,var(--aqua) 20%,transparent)}
.tab[aria-selected="true"]{background:var(--deep);color:#fff}
.tab:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.panel{padding:24px 26px;min-width:0}
.panel h2{font-size:20px;margin-bottom:6px}
.d{color:var(--muted);margin:0 0 18px}
@media(max-width:780px){
  .hub{grid-template-columns:1fr}
  .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:2px solid var(--line);padding:10px}
  .meetname{display:none}.tab{white-space:nowrap}.panel{padding:18px}
}

.stats{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:18px}
.stat b{display:block;font-family:'Fredoka',sans-serif;font-size:24px}
.stat span{color:var(--muted);font-size:14px}

.addbox{display:grid;grid-template-columns:1.4fr 1.2fr .8fr auto;gap:10px;align-items:end;padding:14px;border:2px solid var(--line);border-radius:14px;margin-bottom:18px}
.addbox.editing{border-color:var(--rope)}
.f{display:grid;gap:4px;min-width:0}
.f label{font-weight:600;font-size:14px}
input,select,textarea{font:16px 'Nunito',sans-serif;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--text);width:100%;min-width:0}
textarea{resize:vertical;min-height:110px}
input[type=checkbox]{width:auto;accent-color:var(--deep)}
@media(max-width:780px){.addbox{grid-template-columns:1fr 1fr}.addbox .f:first-child{grid-column:1/-1}.addbox .btnrow{grid-column:1/-1}}

.btn{border:0;cursor:pointer;font:600 15px 'Nunito',sans-serif;padding:10px 18px;border-radius:14px;background:var(--deep);color:#fff}
.btn:hover{filter:brightness(1.15)}
.btn.alt{background:transparent;color:var(--text);box-shadow:inset 0 0 0 2px var(--line)}
.btn.yellow{background:var(--rope);color:#0B3A66}.btn.yellow:hover{filter:brightness(.95)}
.btn.tiny{padding:5px 12px;font-size:14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.toolbar label{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.toolbar select{width:auto;padding:6px 10px}

.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle}
th{font-weight:600;font-size:14px;color:var(--muted);background:color-mix(in srgb,var(--surface) 93%,var(--aqua))}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok-tx)}
.pill.wait{background:var(--wait-bg);color:var(--wait-tx)}
.pill.no{background:var(--no-bg);color:var(--no-tx)}
.empty{padding:34px 18px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:14px}
.toast{margin-top:14px;font-weight:600;color:var(--link);min-height:1.5em}
.err{color:var(--no-tx);font-weight:600;margin:-6px 0 12px;min-height:1.2em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.qrow{display:grid;grid-template-columns:1fr 150px 120px;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.qrow:first-child{border-top:0}
@media(max-width:600px){.qrow{grid-template-columns:1fr 120px}.qrow .pill{grid-column:1/-1;justify-self:start}}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools .btn[aria-pressed="true"]{background:var(--deep);color:#fff;box-shadow:none}
.note{font-size:14px;color:var(--muted);margin-top:10px}
.linkbtn{all:unset;cursor:pointer;font-weight:600;color:var(--link);text-decoration:underline;text-underline-offset:3px}
.linkbtn:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.linkbtn.cur{color:var(--text)}
.addbox5{display:grid;grid-template-columns:1.1fr .8fr 1fr 1.2fr auto;gap:10px;align-items:end;padding:14px;border:2px solid var(--line);border-radius:14px;margin-bottom:12px}
@media(max-width:780px){.addbox5{grid-template-columns:1fr 1fr}.addbox5 .btnrow{grid-column:1/-1}}
.chartbox{border:1px solid var(--line);border-radius:12px;padding:14px 14px 8px;margin:18px 0}
.chartbox h3{font-size:16px;margin-bottom:2px}
.addbox3{display:grid;grid-template-columns:1.6fr 1fr auto;gap:10px;align-items:end;padding:14px;border:2px solid var(--line);border-radius:14px;margin-bottom:12px}
.addbox4{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:10px;align-items:end;padding:14px;border:2px solid var(--line);border-radius:14px;margin-bottom:12px}
@media(max-width:780px){.addbox3{grid-template-columns:1fr 1fr}.addbox3 .f:first-child{grid-column:1/-1}.addbox3 .btnrow{grid-column:1/-1}.addbox4{grid-template-columns:1fr 1fr}.addbox4 .f:first-child{grid-column:1/-1}.addbox4 .btnrow{grid-column:1/-1}}
.sec{font-family:'Fredoka',sans-serif;font-size:16px;margin:26px 0 10px}
#fbov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.fbbox{background:var(--surface);color:var(--text);border-radius:16px;padding:22px;max-width:680px;width:100%;max-height:92%;overflow:auto}
.fbbox h3{font-size:18px;margin-bottom:6px}
#fbta{min-height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;white-space:pre;overflow:auto}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<header>
  <div class="hwrap">
    <svg viewBox="64 82 172 172" role="img" aria-label="Dolphin Swim Academy logo"><circle cx="150" cy="168" r="84" fill="#05508A"/><g fill="#fff"><path d="M 134 156 C 138 142 142 128 148 117 C 156 124 162 134 164 144 C 180 141 197 149 205 163 C 211 167 216 170 212 174 C 207 177 199 176 192 176 C 186 177 183 180 182 185 C 176 186 168 190 168 197 C 174 202 187 200 197 190 C 194 210 176 222 154 222 C 130 222 116 208 120 192 C 123 180 133 174 134 164 Z"/><rect x="108" y="150" width="9" height="9"/><rect x="119" y="141" width="9" height="9"/><rect x="100" y="166" width="9" height="9"/><rect x="113" y="176" width="9" height="9"/><rect x="104" y="188" width="8" height="8"/><rect x="122" y="130" width="7" height="7"/><rect x="96" y="204" width="7" height="7"/></g><circle cx="185" cy="157" r="3.6" fill="#05508A"/></svg>
    <div><h1>Meet management</h1><p>Dolphin Swim Academy · coaches only</p><p id="sync" aria-live="polite" style="font-size:14px;margin-top:4px"></p></div>
  </div>
  <div class="ropeline"></div>
</header>

<main>
  <div class="hub">
    <div class="side" role="tablist" aria-label="Meet tools" id="side"></div>
    <div class="panel" id="panel" role="tabpanel" tabindex="0"></div>
  </div>
</main>

<script>
var KEY='dolphin-meet-v1';
var EVENTS=['50 Free','100 Free','200 Free','400 Free','50 Back','100 Back','200 Back','50 Breast','100 Breast','200 Breast','50 Fly','100 Fly','200 IM','400 IM'];
var state={meet:{name:'My meet',date:'',warmup:'',deadline:'',fee:10},entries:[],quals:{},results:[],swimmers:[],profiles:{},fees:{},coachFee:0,payments:[]};
var selected={}; var tab='entries'; var editId=null; var sortBy='added'; var reportKind='swimmer'; var cur=null; var curEvent=null;

try{var raw=localStorage.getItem(KEY); if(raw){var p=JSON.parse(raw); if(p&&p.entries){state=p; state.meet=state.meet||{}; state.quals=state.quals||{}; state.results=state.results||[]; state.swimmers=state.swimmers||[]; state.profiles=state.profiles||{}; state.fees=state.fees||{}; state.payments=state.payments||[]; if(state.coachFee==null)state.coachFee=0;}}}catch(e){}
var ver=0,pulled=false,busy=false,again=false,dirty=false,saveTimer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){} dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(remoteSave,500);}
function setSync(k){
  var el=document.getElementById('sync'); if(!el) return;
  var t={loading:'Loading your saved data…',saving:'Saving…',saved:'✓ Saved to the database',local:'Offline: saved on this device only. Retrying…',error:'Could not save online. Retrying…',conflict:'Someone else just made changes, so the latest data was loaded. Please redo your last change.'};
  el.textContent=t[k]||'';
}
function payload(){return {meet:state.meet,entries:state.entries,quals:state.quals,swimmers:state.swimmers,profiles:state.profiles,fees:state.fees,coachFee:state.coachFee,results:state.results,payments:state.payments};}
function applyRemote(d,v){
  ver=v||0; if(!d) return;
  state={meet:d.meet||{},entries:d.entries||[],quals:d.quals||{},swimmers:d.swimmers||[],results:d.results||[],profiles:d.profiles||{},fees:d.fees||{},coachFee:d.coachFee||0,payments:d.payments||[]};
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  if(editId&&!state.entries.some(function(e){return e.id===editId;})) editId=null;
  render();
}
function getJson(r){return r.json().then(function(j){return {s:r.status,j:j};});}
function remoteSave(){
  if(!pulled) return;
  if(busy){again=true;return;}
  busy=true; dirty=false; setSync('saving');
  fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({version:ver,data:payload()})}).then(getJson).then(function(x){
    busy=false;
    if(x.s===409){again=false;dirty=false;applyRemote(x.j.data,x.j.version);setSync('conflict');return;}
    if(x.s!==200) throw new Error('save failed');
    ver=x.j.version; setSync('saved');
    if(again||dirty){again=false;remoteSave();}
  }).catch(function(){busy=false;again=false;dirty=true;setSync('error');clearTimeout(saveTimer);saveTimer=setTimeout(remoteSave,8000);});
}
function hasLocal(){return state.entries.length||state.results.length||state.swimmers.length||state.payments.length||Object.keys(state.profiles).length;}
function pull(){
  setSync('loading');
  return fetch('/api/state').then(getJson).then(function(x){
    if(x.s!==200) throw new Error('load failed');
    pulled=true;
    if(x.j.data){applyRemote(x.j.data,x.j.version);setSync('saved');}
    else {ver=0; if(hasLocal()) remoteSave(); else setSync('saved');}
  }).catch(function(){setSync('local');setTimeout(pull,10000);});
}
function typing(){var a=document.activeElement;return a&&panel.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);}
function poll(){
  if(!pulled||busy||dirty) return;
  fetch('/api/state').then(getJson).then(function(x){
    if(x.s!==200||busy||dirty||typing()) return;
    if(x.j.version!==ver&&x.j.data) applyRemote(x.j.data,x.j.version);
  }).catch(function(){});
}
function initDb(){ pull(); setInterval(poll,30000); }
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* times */
function parseTime(t){
  t=String(t||'').trim().replace(',','.');
  var m=t.match(/^(?:(\d{1,2}):)?(\d{1,2})(?:\.(\d{1,2}))?$/);
  if(!m) return null;
  var mins=m[1]?parseInt(m[1],10):0, secs=parseInt(m[2],10), frac=m[3]?parseInt((m[3]+'0').slice(0,2),10):0;
  if(secs>=60 && m[1]) return null;
  return mins*60+secs+frac/100;
}
function fmt(sec){
  if(sec==null) return '—';
  var m=Math.floor(sec/60), s=(sec-m*60).toFixed(2);
  if(parseFloat(s)>=60){m+=1;s='0.00';}
  if(m>0){ return m+':'+(parseFloat(s)<10?'0':'')+s; }
  return s;
}
function status(e){
  var q=state.quals[e.event]; var qs=parseTime(q); var t=parseTime(e.time);
  if(qs==null||t==null) return {c:'wait',l:'No standard set'};
  return t<=qs?{c:'ok',l:'Qualified'}:{c:'no',l:'Not yet qualified'};
}
function names(){var o={};state.entries.forEach(function(e){o[e.name]=1;});return Object.keys(o).sort();}

function sorted(){
  var a=state.entries.slice();
  if(sortBy==='name') a.sort(function(x,y){return x.name.localeCompare(y.name)||EVENTS.indexOf(x.event)-EVENTS.indexOf(y.event);});
  if(sortBy==='event') a.sort(function(x,y){return EVENTS.indexOf(x.event)-EVENTS.indexOf(y.event)||(parseTime(x.time)||9e9)-(parseTime(y.time)||9e9);});
  if(sortBy==='time') a.sort(function(x,y){return (parseTime(x.time)||9e9)-(parseTime(y.time)||9e9);});
  return a;
}

/* tabs */
var TABS=[['entries','Entries'],['swimmers','Swimmers'],['records','Records'],['qual','Qualification'],['reports','Reports'],['msg','Messages'],['billing','Meet billing'],['pay','Coaching fees']];
function renderSide(){
  var m=state.meet;
  var h='<div class="meetname">'+esc(m.name||'Dolphin Swim Academy')+'<span>'+(m.date?esc(m.date)+' · ':'')+allNames().length+' swimmers</span></div>';
  TABS.forEach(function(t){h+='<button class="tab" role="tab" id="tab-'+t[0]+'" aria-selected="'+(tab===t[0])+'" data-tab="'+t[0]+'">'+t[1]+'</button>';});
  h+='<button class="tab" id="xlsAll" style="margin-top:auto;font-weight:700;color:var(--link)">Download everything (Excel)</button>';
  document.getElementById('side').innerHTML=h;
}
var panel=document.getElementById('panel');
function render(){renderSide();panel.setAttribute('aria-labelledby','tab-'+tab);panel.innerHTML=views[tab]();after();}
function toast(t){var el=document.getElementById('toast');if(el){el.textContent=t;}}
function after(){ if(tab==='entries'&&editId){var n=document.getElementById('fn'); if(n)n.focus();} }

var views={};

views.entries=function(){
  var ed=editId?state.entries.filter(function(e){return e.id===editId;})[0]:null;
  var q=state.entries.length, sw=names().length;
  var h='<h2>Entries</h2><p class="d">Add each swimmer with the race and their entry time. Add the same name again for another race.</p>';
  h+='<div class="stats"><div class="stat"><b>'+sw+'</b><span>Swimmers</span></div><div class="stat"><b>'+q+'</b><span>Entries</span></div></div>';
  h+='<div class="addbox'+(ed?' editing':'')+'">';
  h+='<div class="f"><label for="fn">Swimmer name</label><input id="fn" list="nl" autocomplete="off" value="'+(ed?esc(ed.name):'')+'"><datalist id="nl">'+allNames().map(function(n){return '<option value="'+esc(n)+'">';}).join('')+'</datalist></div>';
  h+='<div class="f"><label for="fe">Race</label><select id="fe">'+EVENTS.map(function(x){return '<option'+(ed&&ed.event===x?' selected':'')+'>'+x+'</option>';}).join('')+'</select></div>';
  h+='<div class="f"><label for="ft">Time</label><input id="ft" inputmode="decimal" placeholder="1:08.45" value="'+(ed?esc(ed.time):'')+'"></div>';
  h+='<div class="btnrow"><button class="btn yellow" id="saveEntry">'+(ed?'Save changes':'Add entry')+'</button>'+(ed?'<button class="btn alt" id="cancelEdit">Cancel</button>':'')+'</div></div>';
  h+='<div class="err" id="err" role="alert"></div>';
  if(!q){ return h+'<div class="empty">No entries yet. Add your first swimmer above.</div>'; }
  var list=sorted();
  var allSel=list.every(function(e){return selected[e.id];});
  h+='<div class="toolbar"><label>Sort by <select id="sortBy"><option value="added"'+(sortBy==='added'?' selected':'')+'>Order added</option><option value="name"'+(sortBy==='name'?' selected':'')+'>Swimmer name</option><option value="event"'+(sortBy==='event'?' selected':'')+'>Race</option><option value="time"'+(sortBy==='time'?' selected':'')+'>Time</option></select></label>';
  h+='<div class="btnrow"><button class="btn yellow tiny" id="xlsEntries">Download entries as Excel</button><button class="btn alt tiny" id="clearAll">Clear all entries</button></div></div>';
  h+='<div class="tscroll"><table><thead><tr><th><input type="checkbox" id="selAll" aria-label="Select all"'+(allSel?' checked':'')+'></th><th>Swimmer</th><th>Race</th><th class="num">Time</th><th></th></tr></thead><tbody>';
  list.forEach(function(e){
    var s=status(e);
    h+='<tr><td><input type="checkbox" class="sel" data-id="'+e.id+'" aria-label="Select '+esc(e.name)+' '+esc(e.event)+'"'+(selected[e.id]?' checked':'')+'></td><td><button class="linkbtn" data-open="'+esc(e.name)+'" title="Open swimmer file">'+esc(e.name)+'</button></td><td>'+esc(e.event)+'</td><td class="num">'+esc(fmt(parseTime(e.time)))+'</td>';
    h+='<td><div class="btnrow" style="flex-wrap:nowrap"><button class="btn alt tiny" data-edit="'+e.id+'">Edit</button><button class="btn alt tiny" data-del="'+e.id+'">Delete</button></div></td></tr>';
  });
  h+='</tbody></table></div><p class="note">Tick entries to choose recipients on the Messages tab. Your data saves automatically.</p><div class="toast" id="toast" role="status"></div>';
  return h;
};

views.qual=function(){
  var used=EVENTS.filter(function(ev){return state.entries.some(function(e){return e.event===ev;});});
  var h='<h2>Qualification</h2><p class="d">Set the qualifying time for each race. Swimmers at or under it show as qualified.</p>';
  if(!used.length) return h+'<div class="empty">Add entries first, then set qualifying times for their races.</div>';
  h+='<div class="tscroll" style="padding:0">';
  used.forEach(function(ev){
    var es=state.entries.filter(function(e){return e.event===ev;});
    var qn=es.filter(function(e){return status(e).c==='ok';}).length;

/* ===== swimmer management ===== */
var swSort='young',fYear='';
function prof(n){return state.profiles[n]||{};}
function yobOf(n){var y=parseInt(prof(n).yob,10);return isNaN(y)?null:y;}
function ageOf(n){var y=yobOf(n);return y==null?null:new Date().getFullYear()-y;}
function validYob(v){var y=parseInt(v,10);return (!isNaN(y)&&y>=1930&&y<=new Date().getFullYear())?y:null;}
function byAge(a,b){
  var ya=yobOf(a),yb=yobOf(b);
  if(ya==null&&yb==null) return a.localeCompare(b);
  if(ya==null) return 1;
  if(yb==null) return -1;
  if(ya!==yb) return swSort==='young'?yb-ya:ya-yb;
  return a.localeCompare(b);
}
function sortedNames(){return allNames().sort(byAge);}
function yearsList(){var o={};allNames().forEach(function(n){var y=yobOf(n);if(y!=null)o[y]=1;});return Object.keys(o).map(Number).sort(function(a,b){return b-a;});}
function yearOptions(sel,blank){return '<option value="">'+blank+'</option>'+yearsList().map(function(y){return '<option'+(String(y)===String(sel)?' selected':'')+'>'+y+'</option>';}).join('');}
function pickNames(year){return sortedNames().filter(function(n){return !year||String(yobOf(n))===String(year);});}

function renameSwimmer(o,nn){
  if(o===nn) return;
  state.swimmers=state.swimmers.map(function(x){return x===o?nn:x;});
  state.entries.forEach(function(e){if(e.name===o)e.name=nn;});
  state.results.forEach(function(r){if(r.name===o)r.name=nn;});
  state.payments.forEach(function(p){if(p.name===o)p.name=nn;});
  if(state.profiles[o]){state.profiles[nn]=state.profiles[o];delete state.profiles[o];}
  if(state.fees[o]!=null){state.fees[nn]=state.fees[o];delete state.fees[o];}
}
function removeSwimmer(n){
  state.swimmers=state.swimmers.filter(function(x){return x!==n;});
  state.results=state.results.filter(function(r){return r.name!==n;});
  state.payments=state.payments.filter(function(p){return p.name!==n;});
  state.entries=state.entries.filter(function(e){if(e.name===n){delete selected[e.id];return false;}return true;});
  delete state.profiles[n]; delete state.fees[n];
}

/* ===== times and personal records ===== */
var recEv='100 Free',recYear='';
function compLabel(r){return (r.meet||'').trim()||fmtDate(r.date);}
function bestRes(n,ev){var best=null;resultsOf(n,ev).forEach(function(r){var t=parseTime(r.time);if(best==null||t<best.t)best={t:t,r:r};});return best;}
function dtxt(d){return Math.abs(d)<0.005?'0.00':(d<0?'\u2212'+(-d).toFixed(2):'+'+d.toFixed(2));}
function pbRows(ev,year){
  var rows=[];
  pickNames(year).forEach(function(n){var b=bestRes(n,ev);if(!b)return;var rs=resultsOf(n,ev);rows.push({n:n,best:b,latest:rs[rs.length-1],count:rs.length});});
  rows.sort(function(a,b){return a.best.t-b.best.t;});
  return rows;
}
function compData(ev,year){
  var names=pickNames(year),first={},cell={};
  names.forEach(function(n){resultsOf(n,ev).forEach(function(r){
    var l=compLabel(r),t=parseTime(r.time);
    if(first[l]==null||r.date<first[l])first[l]=r.date;
    cell[n]=cell[n]||{};
    if(cell[n][l]==null||t<cell[n][l])cell[n][l]=t;
  });});
  var labels=Object.keys(first).sort(function(a,b){return first[a]<first[b]?-1:first[a]>first[b]?1:a.localeCompare(b);});
  var rows=[];
  names.forEach(function(n){if(!cell[n])return;
    var vals=labels.map(function(l){return cell[n][l]==null?null:cell[n][l];});
    var have=vals.filter(function(v){return v!=null;});
    rows.push({n:n,vals:vals,best:have.length?Math.min.apply(null,have):null,change:have.length>1?have[have.length-1]-have[0]:null});
  });
  return {labels:labels,rows:rows};
}
function clubRecords(year){
  var out=[];
  EVENTS.forEach(function(ev){var best=null;
    pickNames(year).forEach(function(n){var b=bestRes(n,ev);if(b&&(!best||b.t<best.t))best={t:b.t,r:b.r,n:n};});
    if(best)out.push({ev:ev,t:best.t,n:best.n,r:best.r});
  });
  return out;
}

var payMonth=today().slice(0,7);
function fmtMonth(p){var d=new Date(p+'-01T00:00:00');return isNaN(d.getTime())?p:d.toLocaleDateString(undefined,{month:'long',year:'numeric'});}
function feeOf(n){var f=parseFloat(state.fees[n]);return isNaN(f)?(parseFloat(state.coachFee)||0):f;}
function paidIn(n,period){var t=0;state.payments.forEach(function(p){if(p.name===n&&p.period===period)t+=parseFloat(p.amount)||0;});return t;}
function payStatus(fee,paid){
  if(fee<=0) return {c:'wait',l:'No fee set'};

  return {c:'no',l:'Unpaid'};
}

function chartSVG(n,ev){
  var rs=resultsOf(n,ev); if(!rs.length) return '';
  var W=600,H=230,L=58,R=46,T=26,B=42;
  var ts=rs.map(function(r){return parseTime(r.time);});
  var mn=Math.min.apply(null,ts),mx=Math.max.apply(null,ts);
  var pad=(mx-mn)||Math.max(mn*0.02,0.5), lo=mn-pad*0.3, hi=mx+pad*0.3;
  function X(i){return rs.length===1?L+(W-L-R)/2:L+i*(W-L-R)/(rs.length-1);}
  function Y(t){return T+(t-lo)/(hi-lo)*(H-T-B);}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Times for '+esc(ev)+', '+rs.length+' results, best '+esc(fmt(mn))+'" style="width:100%;height:auto;display:block;font-family:inherit">';
  var lines=(mn===mx)?[mn]:[mn,mx];
  lines.forEach(function(v){var y=Y(v).toFixed(1);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--line)" stroke-dasharray="4 4"/><text x="'+(L-8)+'" y="'+(+y+4)+'" text-anchor="end" font-size="12" style="fill:var(--muted)">'+esc(fmt(v))+'</text>';});
  s+='<polyline points="'+rs.map(function(r,i){return X(i).toFixed(1)+','+Y(ts[i]).toFixed(1);}).join(' ')+'" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" style="stroke:var(--aqua)"/>';
  var many=rs.length>8;
  rs.forEach(function(r,i){var isBest=ts[i]===mn,x=X(i).toFixed(1),y=Y(ts[i]).toFixed(1);
    s+='<circle cx="'+x+'" cy="'+y+'" r="'+(isBest?7:5)+'" style="fill:'+(isBest?'var(--coral)':'var(--deep)')+';stroke:var(--surface)" stroke-width="2"/>';
    if(!many||isBest||i===rs.length-1) s+='<text x="'+x+'" y="'+(+y-12)+'" text-anchor="middle" font-size="12" font-weight="600" style="fill:var(--text)">'+esc(fmt(ts[i]))+'</text>';
    if(!many||i===0||i===rs.length-1) s+='<text x="'+x+'" y="'+(H-14)+'" text-anchor="middle" font-size="12" style="fill:var(--muted)">'+esc(shortDate(r.date))+'</text>';
  });
  return s+'</svg>';
}

function anchorSave(name,data){

    var url=URL.createObjectURL(blob),a=document.createElement('a');

function saveFile(name,data,sheets){

    d.save({filename:name,data:data}).then(function(){toast('Download ready: '+name);},function(e){

    var all=document.getElementById('selAll'); if(all)all.checked=state.entries.every(function(e){return selected[e.id];});return;}
});
panel.addEventListener('input',function(ev){
  var t=ev.target;
});
panel.addEventListener('focusout',function(ev){
  var t=ev.target;
  if(t.classList&&t.classList.contains('qin')){
    var v=t.value.trim(); var ts=parseTime(v);
    if(v===''){delete state.quals[t.dataset.ev];}
    else if(ts!=null){state.quals[t.dataset.ev]=fmt(ts);}
    save(); if(tab==='qual') render();
  }
});
panel.addEventListener('keydown',function(ev){
  if(ev.key==='Enter'&&(ev.target.id==='fn'||ev.target.id==='ft'||ev.target.id==='fe')){ev.preventDefault();document.getElementById('saveEntry').click();}
  if(ev.key==='Enter'&&ev.target.classList.contains('qin')){ev.target.blur();}
});

panel.addEventListener('click',function(ev){
  var t=ev.target;
  var o=t.closest('[data-open]'); if(o){tab='swimmers';cur=o.dataset.open;curEvent=null;render();window.scrollTo({top:0,behavior:'smooth'});return;}
  if(t.id==='backList'){cur=null;render();return;}
  if(t.id==='addSwimmer'){
    var name=document.getElementById('ns').value.trim().replace(/\s+/g,' ');
    if(!name){document.getElementById('err').textContent='Enter the swimmer\u2019s name.';return;}
    var ex=allNames().filter(function(x){return x.toLowerCase()===name.toLowerCase();})[0];
    if(ex){cur=ex;curEvent=null;render();return;}
    var yv=((document.getElementById('nyob')||{}).value||'').trim(),yob=null;
    if(yv){yob=validYob(yv);if(yob==null){document.getElementById('err').textContent='Enter a year of birth like 2014.';return;}}
    state.swimmers.push(name);state.profiles[name]=yob?{yob:yob}:{};save();cur=name;curEvent=null;render();return;
  }
  if(t.id==='saveResult'){
    var err=document.getElementById('err');
    var event=document.getElementById('rev').value,time=document.getElementById('rt').value.trim(),date=document.getElementById('rd').value,note=document.getElementById('rn').value.trim();
    var ts=parseTime(time);
    if(ts==null){err.textContent='Enter the time like 1:08.45 or 34.50.';return;}
    if(!date){err.textContent='Choose the date of the swim.';return;}
    state.results.push({id:uid(),name:cur,event:event,time:fmt(ts),date:date,meet:note,at:Date.now()});
    curEvent=event;save();render();
    var rt=document.getElementById('rt');if(rt)rt.focus();
    return;
  }
  var rd=t.closest('[data-rdel]'); if(rd){var id=rd.dataset.rdel;state.results=state.results.filter(function(r){return r.id!==id;});save();render();return;}
  var ce=t.closest('[data-chartev]'); if(ce){curEvent=ce.dataset.chartev;render();return;}
  var hh=t.closest('[data-hist]'); if(hh){
    var en=state.entries.filter(function(e){return e.id===hh.dataset.hist;})[0];
    if(en){state.results.push({id:uid(),name:en.name,event:en.event,time:en.time,date:today(),meet:state.meet.name||'',at:Date.now()});curEvent=en.event;save();render();toast('Added to '+en.name+'\u2019s history.');}
    return;
  }
  if(t.id==='delSwimmer'){
    if(t.dataset.confirm){removeSwimmer(cur);cur=null;save();render();}
    else{t.dataset.confirm='1';t.textContent='Click again to delete this file and all entries';}
    return;
  }
});
panel.addEventListener('keydown',function(ev){
  if(ev.key!=='Enter')return;
  var id=ev.target.id;
  if(id==='rt'||id==='rn'||id==='rd'){ev.preventDefault();document.getElementById('saveResult').click();}
  if(id==='ns'){ev.preventDefault();document.getElementById('addSwimmer').click();}
});

panel.addEventListener('click',function(ev){
  var id=ev.target.id;
  if(id==='xlsReport'||id==='xlsBilling'){
    
    try{
      if(id==='xlsReport') exportSheets(slug(state.meet.name)+'-reports',reportSheets());
      else exportSheets(slug(state.meet.name)+'-billing',billingSheets());
    }catch(e){toast('Could not create the Excel file.');}
    return;
  }
  if(id==='csvBilling'){
    var d=billingData(); csvBilling(d); return;
    saveFile(slug(state.meet.name)+'-billing.csv','\uFEFF'+d.summary.map(csvLine).join('\r\n'));
    return;
  }
});

panel.addEventListener('click',function(ev){
  var id=ev.target.id;
  if(id==='xlsSwimmer'&&cur) exportSheets(slug(cur)+'-swimmer-file',swimmerSheets(cur));
  if(id==='xlsAllSwimmers') exportSheets(slug(state.meet.name)+'-all-swimmer-files',allSwimmerSheets());
});

panel.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.classList&&t.classList.contains('bfee')){
    var v=parseFloat(String(t.value).replace(',','.'));
    if(!isNaN(v)&&v>=0){state.entries.forEach(function(e){if(e.id===t.dataset.id)e.fee=+v.toFixed(2);});save();}
    render();return;
  }
  if(t.id==='deffee'){
    var d=parseFloat(String(t.value).replace(',','.'));
    if(!isNaN(d)&&d>=0){state.meet.fee=+d.toFixed(2);save();}
    render();return;
  }
});
panel.addEventListener('click',function(ev){
  if(ev.target.id==='applyFee'){
    var d=parseFloat(state.meet.fee)||0;
    state.entries.forEach(function(e){e.fee=d;});save();render();
    toast('Every entry is now '+d.toFixed(2)+'.');
  }
});
panel.addEventListener('keydown',function(ev){
  if(ev.key==='Enter'&&ev.target.classList&&(ev.target.classList.contains('bfee')||ev.target.id==='deffee')){ev.preventDefault();ev.target.blur();}
});

function entriesSheets(){
  var rows=[['Swimmer','Race','Time']];
  state.entries.slice().sort(function(x,y){return x.name.localeCompare(y.name)||byEventIdx(x,y);}).forEach(function(e){rows.push([e.name,e.event,fmt(parseTime(e.time))]);});
  return [{name:'Entries',rows:rows,cols:[26,14,12]}];
}
function qualSheets(){
  var rows=[['Race','Qualifying time','Swimmer','Entry time','Qualified']];
  EVENTS.forEach(function(ev){
    state.entries.filter(function(e){return e.event===ev;}).sort(function(a,b){return (parseTime(a.time)||9e9)-(parseTime(b.time)||9e9);}).forEach(function(e){
      var st=status(e);
      rows.push([ev,state.quals[ev]||'',e.name,fmt(parseTime(e.time)),st.c==='ok'?'Yes':(st.c==='no'?'No':'No standard set')]);
    });
  });
  return [{name:'Qualification',rows:rows,cols:[14,16,26,12,16]}];
}
function uniqSheets(sheets){
  var used={};
  sheets.forEach(function(sh){
    var base=sh.name.slice(0,27),k=sh.name.slice(0,31),i=2;
    while(used[k.toLowerCase()]){k=base+' '+i;i++;}
    used[k.toLowerCase()]=1;sh.name=k;
  });
  return sheets;
}
function everythingSheets(){
  return uniqSheets(entriesSheets().concat(qualSheets(),billingSheets(),paymentsSheets(),recordsSheets(),allSwimmerSheets()));
}
document.getElementById('side').addEventListener('click',function(ev){
  if(ev.target.id==='xlsAll') exportSheets(slug(state.meet.name)+'-everything',everythingSheets());
});
panel.addEventListener('click',function(ev){
  var id=ev.target.id;
  if(id==='xlsEntries') exportSheets(slug(state.meet.name)+'-entries',entriesSheets());
  if(id==='xlsQual') exportSheets(slug(state.meet.name)+'-qualification',qualSheets());
});

panel.addEventListener('click',function(ev){
  var t=ev.target;
  var rm=t.closest('[data-rm]');
  if(rm){
    if(rm.dataset.confirm){removeSwimmer(rm.dataset.rm);save();render();}
    else{rm.dataset.confirm='1';rm.textContent='Click again to remove';}
    return;
  }
  if(t.id==='saveProfile'){
    var nn=document.getElementById('pn').value.trim().replace(/\s+/g,' '),err=document.getElementById('perr');
    if(!nn){err.textContent='Enter the swimmer\u2019s name.';return;}
    var clash=allNames().filter(function(x){return x!==cur&&x.toLowerCase()===nn.toLowerCase();})[0];
    if(clash){err.textContent='A swimmer called '+clash+' already exists.';return;}
    var yv=document.getElementById('pyob').value.trim(),yob=null;
    if(yv){yob=validYob(yv);if(yob==null){err.textContent='Enter a year of birth like 2014.';return;}}
    renameSwimmer(cur,nn);
    if(state.swimmers.indexOf(nn)<0) state.swimmers.push(nn);
    state.profiles[nn]=yob?{yob:yob}:{};
    cur=nn;save();render();return;
  }
  if(t.id==='xlsRecords'){exportSheets(slug(state.meet.name)+'-records',recordsSheets());return;}
  if(t.id==='xlsPay'){exportSheets('coaching-fees-'+payMonth,paymentsSheets());return;}
  if(t.id==='applyCoachFee'){
    var d=parseFloat(state.coachFee)||0;
    allNames().forEach(function(n){state.fees[n]=d;});save();render();toast('Every swimmer is now '+d.toFixed(2)+' a month.');return;
  }
  if(t.id==='addPay'){
    var n=document.getElementById('pws').value,amt=parseFloat(String(document.getElementById('pwa').value).replace(',','.')),dt=document.getElementById('pwd').value,note=document.getElementById('pwn').value.trim(),er=document.getElementById('err');
    if(isNaN(amt)||amt<=0){er.textContent='Enter the amount paid.';return;}
    if(!dt){er.textContent='Choose the date paid.';return;}
    state.payments.push({id:uid(),name:n,period:payMonth,date:dt,amount:+amt.toFixed(2),note:note,at:Date.now()});
    save();render();return;
  }
  var mp=t.closest('[data-markpaid]');
  if(mp){
    var nm=mp.dataset.markpaid,bal=feeOf(nm)-paidIn(nm,payMonth);
    if(bal>0.004){state.payments.push({id:uid(),name:nm,period:payMonth,date:today(),amount:+bal.toFixed(2),note:'Paid in full',at:Date.now()});save();render();}
    return;
  }
  var pd=t.closest('[data-pdel]');
  if(pd){var pid=pd.dataset.pdel;state.payments=state.payments.filter(function(p){return p.id!==pid;});save();render();return;}
});
panel.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='fltYear'){fYear=t.value;render();return;}
  if(t.id==='swSort'){swSort=t.value;render();return;}
  if(t.id==='recEv'){recEv=t.value;render();return;}
  if(t.id==='recYear'){recYear=t.value;render();return;}
  if(t.id==='payMonth'){if(t.value)payMonth=t.value;render();return;}
  if(t.id==='coachFee'){var d=parseFloat(String(t.value).replace(',','.'));if(!isNaN(d)&&d>=0){state.coachFee=+d.toFixed(2);save();}render();return;}
  if(t.classList&&t.classList.contains('cfee')){
    var v=parseFloat(String(t.value).replace(',','.'));
    if(!isNaN(v)&&v>=0){state.fees[t.dataset.n]=+v.toFixed(2);save();}
    render();return;
  }
});
panel.addEventListener('keydown',function(ev){
  if(ev.key!=='Enter')return;
  var t=ev.target;
  if(t.classList&&t.classList.contains('cfee')||t.id==='coachFee'){ev.preventDefault();t.blur();}
  if(t.id==='pn'||t.id==='pyob'){ev.preventDefault();document.getElementById('saveProfile').click();}
  if(t.id==='nyob'){ev.preventDefault();document.getElementById('addSwimmer').click();}
  if(t.id==='pwa'||t.id==='pwn'){ev.preventDefault();document.getElementById('addPay').click();}
});

render();
initDb();
</script>
